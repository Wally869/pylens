# pylens nsjail policy — the security-critical artifact, shared by every host (native Linux
# and WSL2-on-Windows). It is hardened as if nsjail were the SOLE boundary; we never lean on
# the outer WSL2 VM to make up for a weak policy.
#
# Boundaries enforced here:
#   * empty network namespace            -> no network at all
#   * read-only bind of the system dirs  -> untrusted code cannot write the rootfs
#   * tmpfs /tmp only                     -> the single writable location, size-capped
#   * new user/pid/ipc/uts/cgroup ns      -> no host PIDs/IPC/host identity, unprivileged
#   * no_new_privs + dropped caps         -> no privilege escalation
#   * rlimits + wall time_limit           -> CPU/memory/file/fd/proc + runaway kill
#   * seccomp denylist (below)            -> the unambiguously dangerous syscalls are blocked
#
# The install dir mount (-> /pylens) and the exec command are appended by the launcher on the
# CLI, because only it knows the host-side install path:
#   nsjail --config pylens.nsjail.cfg \
#          --bindmount_ro "$INSTALL_DIR:/pylens" \
#          -- /usr/bin/python3 /pylens/worker.py [--serve]
#
# This proto-text format is consumed by `nsjail --config`. See config.proto in google/nsjail.

name: "pylens-python-jail"
description: "Run untrusted CPython (pylens worker.py) with no network, a read-only rootfs, and resource limits."

mode: ONCE
hostname: "pylens"
cwd: "/pylens"

# Wall-clock kill for the whole jail (covers infinite loops; per-request isolation is the
# fork-server's job, this is the backstop).
time_limit: 10
max_cpus: 1

# Resource limits.
rlimit_as: 1024      # MB of virtual address space
rlimit_cpu: 10       # seconds of CPU time
rlimit_fsize: 16     # MB max single file write (into the /tmp tmpfs)
rlimit_nofile: 128
rlimit_nproc: 64     # bounded forks (the --serve fork-server needs a handful)
rlimit_stack: 16     # MB

# Namespaces. clone_newnet with no configured interface => no network whatsoever.
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

# No privilege escalation; drop all capabilities. nsjail applies NO_NEW_PRIVS by default
# (it is only ever turned off via disable_no_new_privs), so we simply leave that default on.
keep_caps: false

# Minimal, read-only view of the host filesystem. mandatory:false entries tolerate distros
# where a path is absent or a symlink (e.g. usrmerge makes /bin -> /usr/bin).
mount { src: "/usr"    dst: "/usr"    is_bind: true rw: false mandatory: true  }
mount { src: "/lib"    dst: "/lib"    is_bind: true rw: false mandatory: false }
mount { src: "/lib64"  dst: "/lib64"  is_bind: true rw: false mandatory: false }
mount { src: "/bin"    dst: "/bin"    is_bind: true rw: false mandatory: false }
mount { src: "/sbin"   dst: "/sbin"   is_bind: true rw: false mandatory: false }
mount { src: "/etc/alternatives" dst: "/etc/alternatives" is_bind: true rw: false mandatory: false }

# Devices the interpreter expects.
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true rw: false mandatory: true }
mount { src: "/dev/null"    dst: "/dev/null"    is_bind: true rw: true  mandatory: true }

# The only writable location: a small tmpfs at /tmp. Rootfs stays read-only.
mount { dst: "/tmp" fstype: "tmpfs" rw: true is_bind: false options: "size=16777216,mode=1777" }

# CPython needs a /proc (fresh, under the new PID namespace).
mount { dst: "/proc" fstype: "proc" rw: false }

# A clean, minimal environment.
envar: "LANG=C.UTF-8"
envar: "LC_ALL=C.UTF-8"
envar: "PYTHONIOENCODING=utf-8"
envar: "PYTHONDONTWRITEBYTECODE=1"
envar: "PYTHONHASHSEED=0"
envar: "HOME=/tmp"
envar: "PATH=/usr/bin:/bin"

# Seccomp-bpf denylist (kafel). DEFAULT ALLOW with an explicit KILL set blocks the syscalls
# that enable privilege escalation, kernel-module / namespace games, process injection, and
# raw device access — without the fragility of a CPython-wide allowlist that can break across
# interpreter versions. Tightening this to a strict allowlist is a tracked future hardening.
seccomp_string: "ERRNO(1) { "
seccomp_string: "  ptrace, process_vm_readv, process_vm_writev, "
seccomp_string: "  mount, pivot_root, chroot, "
seccomp_string: "  init_module, finit_module, delete_module, "
seccomp_string: "  kexec_load, reboot, "
seccomp_string: "  setns, unshare, "
seccomp_string: "  add_key, request_key, keyctl, bpf, "
seccomp_string: "  acct, swapon, swapoff, settimeofday, clock_settime, "
seccomp_string: "  mknod, mknodat "
seccomp_string: "} "
seccomp_string: "DEFAULT ALLOW"
