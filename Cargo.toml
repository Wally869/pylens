[package]
name = "pylens"
version = "0.1.0"
edition = "2024"

[dependencies]
# Python parser (Astral / ruff). Not published as stable crates.io crates, so we pin the
# git repo. All `ruff_*` usage is isolated behind the `parse/` module so this is swappable.
# TODO: pin to a specific tag/rev once the foundation builds (currently tracks `main`).
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", branch = "main" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", branch = "main" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
