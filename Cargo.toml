[package]
name = "pylens"
version = "0.1.0"
edition = "2024"

[dependencies]
# Python parser (Astral / ruff). Not published as stable crates.io crates, so we pin the
# git repo. All `ruff_*` usage is isolated behind the `parse/` module so this is swappable.
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", rev = "a8a0614348c1fcf47fc9b666eff61a103914d520" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", rev = "a8a0614348c1fcf47fc9b666eff61a103914d520" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff.git", rev = "a8a0614348c1fcf47fc9b666eff61a103914d520" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", rev = "a8a0614348c1fcf47fc9b666eff61a103914d520" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "=0.4.33"
